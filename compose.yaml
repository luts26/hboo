services:
  nginx:
    image: nginx:1.27-alpine
    container_name: hboo-dev-nginx
    restart: unless-stopped
    ports:
      - "${DEV_HTTP_HOST:-127.0.0.2}:${DEV_HTTP_PORT:-80}:80"
      - "${DEV_HTTPS_HOST:-127.0.0.2}:${DEV_HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - hboo-dev

  mysql:
    image: mysql:8.0.46
    container_name: hboo-dev-mysql
    restart: unless-stopped
    environment:
      # DEV-only database. Do not make this selectable via DB_NAME.
      MYSQL_DATABASE: hboo_dev
      MYSQL_USER: ${DB_USER:-hboo_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    ports:
      - "${DEV_MYSQL_HOST:-127.0.0.2}:${DEV_MYSQL_PORT:-3307}:3306"
    volumes:
      - hboo-dev-mysql-data:/var/lib/mysql
      - ./docker/mysql/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/migrations/20260911_categories.sql:/docker-entrypoint-initdb.d/02-categories.sql:ro
      - ./docker/mysql/migrations/20260911_planning_v2.sql:/docker-entrypoint-initdb.d/03-planning-v2.sql:ro
      - ./docker/mysql/migrations/20260916_planning_transaction_link.sql:/docker-entrypoint-initdb.d/04-planning-transaction-link.sql:ro
      - ./docker/mysql/migrations/20260928_product_catalog_purchases.sql:/docker-entrypoint-initdb.d/05-product-catalog-purchases.sql:ro
      - ./docker/mysql/migrations/20260928_product_taxonomy_bread_fish.sql:/docker-entrypoint-initdb.d/06-product-taxonomy-bread-fish.sql:ro
      - ./docker/mysql/migrations/20260929_purchase_client_mutation_id.sql:/docker-entrypoint-initdb.d/07-purchase-client-mutation-id.sql:ro
      - ./docker/mysql/migrations/20260929_receipts.sql:/docker-entrypoint-initdb.d/08-receipts.sql:ro
      - ./docker/mysql/migrations/20260930_receipt_optional_purchase.sql:/docker-entrypoint-initdb.d/09-receipt-optional-purchase.sql:ro
      - ./docker/mysql/migrations/20260930_receipt_ocr.sql:/docker-entrypoint-initdb.d/10-receipt-ocr.sql:ro
      - ./docker/mysql/migrations/20261001_planning_shopping_items.sql:/docker-entrypoint-initdb.d/11-planning-shopping-items.sql:ro
      - ./docker/mysql/migrations/20261006_planning_item_merchant.sql:/docker-entrypoint-initdb.d/12-planning-item-merchant.sql:ro
      - ./docker/mysql/migrations/20261006_purchase_transaction_link.sql:/docker-entrypoint-initdb.d/13-purchase-transaction-link.sql:ro
      - ./docker/mysql/migrations/20261007_product_aliases.sql:/docker-entrypoint-initdb.d/14-product-aliases.sql:ro
      - ./docker/mysql/seeds/dev.sql:/docker-entrypoint-initdb.d/15-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hboo-dev

  adminer:
    image: adminer:5
    container_name: hboo-dev-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.2:8080:8080"
    networks:
      - hboo-dev

  backend:
    build:
      context: ./backend
    container_name: hboo-dev-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      # DEV-only database. Do not make this selectable via DB_NAME.
      DB_NAME: hboo_dev
      DB_USER: ${DB_USER:-hboo_dev}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      BANK_SERVICE_URL: ${DEV_BANK_SERVICE_URL:-}
      BANK_SERVICE_USER: ${DEV_BANK_SERVICE_USER:-change_me}
      BANK_SERVICE_PASSWORD: ${DEV_BANK_SERVICE_PASSWORD:-change_me}
      RECEIPT_STORAGE_DIR: /data/receipts
      OCR_LANGUAGE: ukr+eng
      OCR_MAX_CONCURRENT: 1
      OCR_TIMEOUT_MS: 60000
    ports:
      - "${DEV_BACKEND_HOST:-127.0.0.2}:${DEV_BACKEND_PORT:-3000}:3000"
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - hboo-dev-receipts:/data/receipts
    networks:
      - hboo-dev

networks:
  hboo-dev:
    name: hboo-dev-network

volumes:
  hboo-dev-mysql-data:
    name: hboo-dev-mysql-data
  hboo-dev-receipts:
    name: hboo-dev-receipts
