server {
    listen 80;
    listen [::]:80;
    server_name hboo.local localhost _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hboo.local localhost _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/hboo.local.pem;
    ssl_certificate_key /etc/nginx/certs/hboo.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Backend route is intentionally disabled until the manual Node.js backend exists.
    location ^~ /api/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hbapp/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
